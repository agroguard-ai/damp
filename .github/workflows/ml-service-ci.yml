name: ML Service CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'ml-service/**'
      - '.github/workflows/ml-service-ci.yml'
  pull_request:
    paths:
      - 'ml-service/**'
      - '.github/workflows/ml-service-ci.yml'

defaults:
  run:
    working-directory: ml-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Los tests de feature engineering y de la API corren siempre (mockean el bundle
      # del modelo con monkeypatch); el test end-to-end contra el modelo real se saltea
      # solo si los artefactos no están presentes — ver ml-service/tests/test_main.py.
      - name: Run tests
        run: pytest tests/ -v
