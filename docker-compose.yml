version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: damp-local-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: damp_db
    ports:
      - "5435:5432"
    volumes:
      - damp_local_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d damp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - damp-network

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: damp-ml-service
    restart: always
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - damp-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: damp-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/damp_db?schema=public
      ML_SERVICE_URL: http://ml-service:8000
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - damp-network

networks:
  damp-network:
    driver: bridge

volumes:
  damp_local_db_data:
